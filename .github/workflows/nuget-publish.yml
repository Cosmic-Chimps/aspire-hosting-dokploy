name: Publish CosmicChimps.Aspire.Hosting.Dokploy to NuGet

# Triggered by tags of the form: v1.2.3  or  v1.2.3-preview.1
#
# To release a new version:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Required GitHub Secret:
#   NUGET_API_KEY  — API key from nuget.org with push scope for CosmicChimps.*

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history required for SourceLink

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Extract version from tag
        id: version
        # Tag: v1.2.3  →  VERSION=1.2.3
        # Tag: v1.2.3-preview.1  →  VERSION=1.2.3-preview.1
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      # Gate the release on the regression suite.
      #
      # Publishing used to pack straight from the tag with nothing run against it, and three
      # separate defects reached nuget.org that way — each one breaking every deploy for every
      # consumer until a follow-up preview. A tag should not be able to ship a package the tests
      # reject.
      - name: Test
        run: |
          dotnet test \
            tests/CosmicChimps.Aspire.Hosting.Dokploy.Tests/CosmicChimps.Aspire.Hosting.Dokploy.Tests.csproj \
            --configuration Release

      - name: Restore
        run: |
          dotnet restore \
            src/CosmicChimps.Aspire.Hosting.Dokploy/CosmicChimps.Aspire.Hosting.Dokploy.csproj

      - name: Build
        run: |
          dotnet build \
            src/CosmicChimps.Aspire.Hosting.Dokploy/CosmicChimps.Aspire.Hosting.Dokploy.csproj \
            --configuration Release \
            --no-restore \
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack
        run: |
          dotnet pack \
            src/CosmicChimps.Aspire.Hosting.Dokploy/CosmicChimps.Aspire.Hosting.Dokploy.csproj \
            --configuration Release \
            --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nuget-output

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nuget-output/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push symbols to NuGet.org
        run: |
          dotnet nuget push ./nuget-output/*.snupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        continue-on-error: true # snupkg push failure is non-fatal
