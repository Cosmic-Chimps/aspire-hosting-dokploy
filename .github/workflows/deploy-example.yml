name: Deploy Example Aspire App to Dokploy

# No automatic triggers — run manually from the Actions tab.
# This is a sample workflow showing how to deploy an Aspire app with
# CosmicChimps.Aspire.Hosting.Dokploy.
#
# Required GitHub Secrets:
#   DOKPLOY_URL             — e.g. https://paas.example.com
#   DOKPLOY_API_TOKEN       — Dokploy API token
#   DOCKERHUB_REGISTRY_URL  — e.g. https://index.docker.io/v1/
#   DOCKERHUB_USERNAME      — DockerHub username (also used as image prefix)
#   DOCKERHUB_PASSWORD      — DockerHub password or access token
#
# Required GitHub Variables:
#   DOKPLOY_ENVIRONMENT     — Target environment within the project: "production" | "staging" | "dev"
#                             Defaults to "production" if not set.
#
# Idempotency: reconciliation matches existing services by appName prefix — no
# state file needed. Re-running the workflow updates services in-place.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Dokploy environment (overrides DOKPLOY_ENVIRONMENT variable)'
        required: false
        default: ''

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire workload
        run: dotnet workload install aspire

      - name: Install Aspire CLI
        uses: timheuer/setup-aspire@v1

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Deploy to Dokploy
        working-directory: example/CosmicChimps.Aspire.AppHost
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOCKERHUB_REGISTRY_URL: ${{ secrets.DOCKERHUB_REGISTRY_URL }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          # Environment resolution order: manual dispatch input → variable → default "production"
          DOKPLOY_ENVIRONMENT: ${{ inputs.environment || vars.DOKPLOY_ENVIRONMENT || 'production' }}
        run: aspire deploy --project CosmicChimps.Aspire.AppHost.csproj
