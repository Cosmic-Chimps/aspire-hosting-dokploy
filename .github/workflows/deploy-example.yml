name: Deploy Example Aspire App to Dokploy

# No automatic triggers — run manually from the Actions tab.
# This is a sample workflow showing how to deploy an Aspire app with
# CosmicChimps.Aspire.Hosting.Dokploy.
#
# Required GitHub Secrets:
#   DOKPLOY_URL             — e.g. https://paas.example.com
#   DOKPLOY_API_TOKEN       — Dokploy API token
#   DOCKERHUB_REGISTRY_URL  — e.g. https://index.docker.io/v1/
#   DOCKERHUB_USERNAME      — DockerHub username (also used as image prefix)
#   DOCKERHUB_PASSWORD      — DockerHub password or access token
#
# The state file (aspire-output/.dokploy-state.json) is cached between runs
# using the GitHub Actions cache so deployments are idempotent — existing
# Dokploy services are reused instead of recreated on every run.

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire workload
        run: dotnet workload install aspire

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Cache the Dokploy state file so re-runs reuse existing services
      # instead of creating duplicates. The reconciliation fallback in the
      # library also handles a cold cache gracefully.
      - name: Restore Dokploy state
        uses: actions/cache@v4
        with:
          path: example/CosmicChimps.Aspire.AppHost/aspire-output/.dokploy-state.json
          key: dokploy-state-${{ github.repository }}-example
          restore-keys: dokploy-state-${{ github.repository }}-

      - name: Deploy to Dokploy
        uses: timheuer/setup-aspire@v0.1.0
        working-directory: example/CosmicChimps.Aspire.AppHost
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOCKERHUB_REGISTRY_URL: ${{ secrets.DOCKERHUB_REGISTRY_URL }}
          DOCKERHUB_Username: ${{ secrets.DOCKERHUB_USERNAME }}
          DockerHub__Password: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: aspire deploy

      # Save updated state so the next run benefits from cached IDs.
      # This step runs even if the deploy step fails so partial state is preserved.
      - name: Save Dokploy state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: example/CosmicChimps.Aspire.AppHost/aspire-output/.dokploy-state.json
          key: dokploy-state-${{ github.repository }}-example
